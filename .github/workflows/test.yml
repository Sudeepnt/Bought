name: test
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r pipeline/requirements.lock pytest==8.4.2
      - run: python -m pytest pipeline/tests -q
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend test
      - run: npm --prefix backend run typecheck
  deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/setup.sh
      - run: docker run --rm -v "$PWD:/srv/bought" -e BOUGHT_DOMAIN=bought.example -e BOUGHT_ROOT=/srv/bought -e BOUGHT_LOG=/tmp/caddy.log caddy:2 caddy validate --config /srv/bought/deploy/Caddyfile --adapter caddyfile
